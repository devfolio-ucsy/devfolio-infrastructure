input {
  tcp {
    port => 5000   # Matches Logstash internal port
    codec => json
  }
}

filter {
  mutate {
    add_field => { "environment" => "dev" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "spring-microservices-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
